<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b88f58"/>
      <stop offset="25%" stop-color="#e6cf9e"/>
      <stop offset="50%" stop-color="#fdf3d1"/>
      <stop offset="75%" stop-color="#d9b675"/>
      <stop offset="100%" stop-color="#a67c44"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e2ba"/>
      <stop offset="100%" stop-color="#ab8248"/>
    </linearGradient>
  </defs>

  <!-- PRERAB Typographic Wordmark -->
  <g fill="url(#goldGrad)" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="106" letter-spacing="4px">
    <text x="20" y="124">PRERAB</text>
  </g>

  <!-- Architectural House Wireframe Icon -->
  <g transform="translate(505, 18)" stroke="url(#goldGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gable Roof Primary -->
    <path d="M 68 18 L 138 68 L 208 120" stroke-width="4.5"/>
    <path d="M 68 18 L 10 68 L 10 120" stroke-width="4"/>
    
    <!-- Roof Tile / Construction Dotted Layer -->
    <path d="M 80 18 L 152 70 L 218 118" stroke-width="2.5" stroke-dasharray="3, 5"/>
    
    <!-- Outer Walls -->
    <line x1="18" y1="68" x2="18" y2="120" stroke-width="4"/>
    <line x1="138" y1="68" x2="138" y2="120" stroke-width="4"/>
    <line x1="198" y1="112" x2="198" y2="120" stroke-width="4"/>
    <line x1="10" y1="120" x2="200" y2="120" stroke-width="4"/>

    <!-- Mesh Wireframe Hatching inside House (Grid Pattern) -->
    <g stroke-width="1.8" opacity="0.95">
      <!-- Horizontal mesh lines -->
      <line x1="18" y1="80" x2="138" y2="80"/>
      <line x1="18" y1="90" x2="138" y2="90"/>
      <line x1="18" y1="100" x2="138" y2="100"/>
      <line x1="18" y1="110" x2="138" y2="110"/>
      
      <!-- Vertical mesh lines -->
      <line x1="30" y1="60" x2="30" y2="120"/>
      <line x1="42" y1="50" x2="42" y2="120"/>
      <line x1="54" y1="40" x2="54" y2="120"/>
      <line x1="66" y1="28" x2="66" y2="120"/>
      <line x1="78" y1="36" x2="78" y2="120"/>
      <line x1="90" y1="46" x2="90" y2="120"/>
      <line x1="102" y1="54" x2="102" y2="120"/>
      <line x1="114" y1="62" x2="114" y2="120"/>
      <line x1="126" y1="70" x2="126" y2="120"/>

      <!-- Diagonal Blueprint Rays -->
      <line x1="68" y1="18" x2="18" y2="120" stroke-width="2"/>
      <line x1="68" y1="18" x2="68" y2="120" stroke-width="2.5"/>
      <line x1="68" y1="18" x2="138" y2="120" stroke-width="2"/>
      
      <!-- Right Annex Doorway and Dimension Dotted Line -->
      <rect x="154" y="85" width="22" height="35" stroke-width="2.5"/>
      <line x1="182" y1="75" x2="182" y2="120" stroke-width="2" stroke-dasharray="2, 4"/>
    </g>
  </g>
</svg>
